name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer (NSIS .exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish onTagOrDraft
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-Windows-Installer
          path: |
            installers/release/*.exe
            installers/release/latest.yml
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --x64 --publish onTagOrDraft
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-macOS-Installer
          path: |
            installers/release/*.dmg
            installers/release/*.zip
            installers/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build AppImage + .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux AppImage deb --x64 --publish onTagOrDraft
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-Linux-Installer
          path: |
            installers/release/*.AppImage
            installers/release/*.deb
            installers/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 30
