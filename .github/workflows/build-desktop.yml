name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"



jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Build installer (NSIS .exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish onTagOrDraft
      - uses: actions/upload-artifact@v4
        with:
          name: TotalControleERP-Windows-Installer
          path: |
            installers/release/*.exe
            installers/release/latest.yml
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Build .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --x64 --publish onTagOrDraft
      - uses: actions/upload-artifact@v4
        with:
          name: TotalControleERP-macOS-Installer
          path: |
            installers/release/*.dmg
            installers/release/*.zip
            installers/release/latest-mac.yml
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Build AppImage + .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb --x64 --publish onTagOrDraft
      - uses: actions/upload-artifact@v4
        with:
          name: TotalControleERP-Linux-Installer
          path: |
            installers/release/*.AppImage
            installers/release/*.deb
            installers/release/latest-linux.yml
          retention-days: 30
