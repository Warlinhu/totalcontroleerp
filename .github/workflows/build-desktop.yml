name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare desktop shell
        run: echo "Electron loads the published app URL, so this installer build does not need a Vite web build."
      - name: Build installer (NSIS .exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-Windows-Installer
          path: |
            installers/release/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare desktop shell
        run: echo "Electron loads the published app URL, so this installer build does not need a Vite web build."
      - name: Build .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --x64 --publish never
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-macOS-Installer
          path: |
            installers/release/*.dmg
            installers/release/*.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2t64 fakeroot rpm
      - run: npm ci
      - name: Prepare desktop shell
        run: echo "Electron loads the published app URL, so this installer build does not need a Vite web build."
      - name: Build AppImage + .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-Linux-Installer
          path: |
            installers/release/*.AppImage
            installers/release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: ubuntu-24.04
    needs: [windows, macos, linux]
    concurrency:
      group: totalcontroleerp-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: installers/release
          merge-multiple: true
      - name: List release files
        run: ls -la installers/release
      - name: Publish to GitHub Release (latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          make_latest: "true"
          overwrite_files: true
          files: |
            installers/release/*.exe
            installers/release/*.dmg
            installers/release/*.zip
            installers/release/*.AppImage
            installers/release/*.deb
