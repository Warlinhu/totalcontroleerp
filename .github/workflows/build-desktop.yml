name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  APP_NAME: TotalControleERP

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Package Windows app
        run: |
          npx @electron/packager . "$APP_NAME" \
            --platform=win32 --arch=x64 \
            --out=installers/release --overwrite \
            --icon=public/icon-512.png \
            --ignore='^/src' \
            --ignore='^/supabase' \
            --ignore='^/installers' \
            --ignore='^/\.github' \
            --ignore='^/\.lovable' \
            --ignore='^/node_modules/(?!electron|electron-updater|auto-launch)'
      - name: Archive Windows app
        run: |
          cd installers/release
          zip -r TotalControleERP-windows-x64.zip TotalControleERP-win32-x64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-Windows
          path: |
            installers/release/TotalControleERP-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Package macOS app
        run: |
          npx @electron/packager . "$APP_NAME" \
            --platform=darwin --arch=x64 \
            --out=installers/release --overwrite \
            --icon=public/icon-512.png \
            --ignore='^/src' \
            --ignore='^/supabase' \
            --ignore='^/installers' \
            --ignore='^/\.github' \
            --ignore='^/\.lovable' \
            --ignore='^/node_modules/(?!electron|electron-updater|auto-launch)'
      - name: Archive macOS app
        run: |
          cd installers/release
          zip -r TotalControleERP-macos-x64.zip TotalControleERP-darwin-x64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-macOS
          path: |
            installers/release/TotalControleERP-macos-x64.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Package Linux app
        run: |
          npx @electron/packager . "$APP_NAME" \
            --platform=linux --arch=x64 \
            --out=installers/release --overwrite \
            --icon=public/icon-512.png \
            --ignore='^/src' \
            --ignore='^/supabase' \
            --ignore='^/installers' \
            --ignore='^/\.github' \
            --ignore='^/\.lovable' \
            --ignore='^/node_modules/(?!electron|electron-updater|auto-launch)'
      - name: Archive Linux app
        run: |
          cd installers/release
          tar -czf TotalControleERP-linux-x64.tar.gz TotalControleERP-linux-x64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TotalControleERP-Linux
          path: |
            installers/release/TotalControleERP-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: ubuntu-24.04
    needs: [windows, macos, linux]
    concurrency:
      group: totalcontroleerp-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: installers/release
          merge-multiple: true
      - name: List release files
        run: ls -la installers/release
      - name: Publish to GitHub Release (latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          make_latest: "true"
          overwrite_files: true
          files: |
            installers/release/*.zip
            installers/release/*.tar.gz
