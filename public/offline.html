<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TotalControle ERP — sem conexão</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0b1220; color: #e2e8f0; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      .box { max-width: 30rem; text-align: center; padding: 2rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
      p { color: #94a3b8; line-height: 1.55; margin: 0 0 1.5rem; }
      button {
        background: #2563eb; color: #fff; border: 0; border-radius: .6rem;
        padding: .7rem 1.4rem; font-size: 1rem; cursor: pointer;
      }
      small { display: block; margin-top: 1rem; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Você está sem internet</h1>
      <p>
        O TotalControle ERP continua instalado no seu dispositivo. Assim que a conexão voltar,
        o sistema abre automaticamente com seus dados atualizados.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
      <small>Reconectando automaticamente…</small>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
      setInterval(() => { if (navigator.onLine) location.reload(); }, 8000);
    </script>
  </body>
</html>
