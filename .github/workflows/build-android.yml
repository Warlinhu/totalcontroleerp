name: Build Android APK

# Gera o .apk automaticamente na nuvem toda vez que você faz push
# na branch main (ou dispara manualmente pela aba Actions do GitHub).
# O arquivo pronto fica disponível como "artifact" para download.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: |
          npx cap add android || echo "Android platform already exists"
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotalControleERP-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
